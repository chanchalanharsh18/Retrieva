services:
  - type: web
    name: retrieva-backend
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
